<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lume</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#09090f;color:#f7f5fa;font:15px system-ui,Arial}header{height:64px;border-bottom:1px solid #292938;display:flex;align-items:center;padding:0 18px;position:sticky;top:0;background:#09090fee;backdrop-filter:blur(12px);z-index:5}.logo{font-size:25px;font-weight:900;color:#e879f9}.nav{margin-left:auto;display:flex;gap:7px}.nav button{background:#15151f;border:1px solid #303041;color:#fff;padding:8px 11px;border-radius:9px}.wrap{max-width:1080px;margin:auto;padding:25px 16px 60px}.muted{color:#aaa5b7;line-height:1.5}.discover{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.creator{padding:16px;border:1px solid #292938;background:#13131d;border-radius:17px;text-decoration:none;color:#fff}.avatar{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#d946ef,#7c3aed);display:grid;place-items:center;font-weight:900;font-size:22px;margin-bottom:10px}.handle{color:#aaa5b7}.profile{display:none}.profile.active{display:block}.back{border:0;background:none;color:#d946ef;font-weight:700}.hero{display:flex;gap:18px;align-items:center;margin:24px 0}.hero .avatar{width:86px;height:86px;font-size:30px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.tile{aspect-ratio:1;background:#171720;position:relative;cursor:pointer}.shade{position:absolute;inset:0;background:linear-gradient(transparent 45%,#000d);padding:10px;display:flex;align-items:flex-end}.badge{font-size:11px;font-weight:800;background:#ffffff22;padding:5px 8px;border-radius:99px}.lock{position:absolute;inset:0;display:grid;place-items:center;background:#09090f77;font-size:32px}.modal{display:none;position:fixed;inset:0;background:#000d;z-index:20;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.box{width:min(500px,100%);max-height:90vh;overflow:auto;background:#151520;border:1px solid #303041;border-radius:20px;padding:22px}.close{float:right;background:none;border:0;color:#aaa;font-size:22px}.cta{width:100%;display:block;background:#d946ef;color:#fff;border:0;border-radius:11px;padding:13px;margin-top:12px;font-weight:800;text-align:center;text-decoration:none;cursor:pointer}.secondary{background:#292938}.input{width:100%;padding:12px;border-radius:10px;border:1px solid #333346;background:#0d0d15;color:#fff;margin-top:8px}.card{border:1px solid #292938;background:#11111a;border-radius:15px;padding:14px;margin:10px 0}.danger{color:#fda4af}.success{color:#86efac}@media(max-width:760px){.discover{grid-template-columns:1fr 1fr}.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header><div class="logo">Lume</div><div class="nav"><button onclick="home()">Beranda</button><button onclick="portal()">Akses Saya</button></div></header><main class="wrap">
<section id="home"><h1>Temukan Kreator</h1><p class="muted">Foto dan video kreator Lume.</p><div id="creators" class="discover"></div></section>
<section id="profile" class="profile"><button class="back" onclick="home()">← Kembali</button><div id="hero" class="hero"></div><div id="grid" class="grid"></div></section></main>
<div id="modal" class="modal"><div class="box"><button class="close" onclick="closeM()">×</button><div id="body"></div></div></div>
<script>
let accessCsrf="";
const $=x=>document.getElementById(x),esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));async function j(u,o){o=o||{};const h=new Headers(o.headers||{});if(!o.skipCsrf&&o.method&&o.method!=="GET"&&o.method!=="HEAD"&&o.method!=="OPTIONS"&&accessCsrf)h.set("x-csrf-token",accessCsrf);const r=await fetch(u,{...o,headers:h}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Gagal");return d}
async function home(){history.pushState({},'','/');$("profile").classList.remove("active");$("home").style.display="block";const c=await j("/api/creators");$("creators").innerHTML=c.map(x=>`<a class="creator" href="/c/${encodeURIComponent(x.handle)}" onclick="event.preventDefault();openCreator('${encodeURIComponent(x.handle)}')"><div class="avatar">${esc(x.name).charAt(0)}</div><b>${esc(x.name)}</b><div class="handle">@${esc(x.handle)}</div><p class="muted">${esc(x.bio||"")}</p></a>`).join("")}
async function openCreator(h){history.pushState({},'','/c/'+h);$("home").style.display="none";$("profile").classList.add("active");const d=await j("/api/creators/"+h);$("hero").innerHTML=`<div class="avatar">${esc(d.creator.name).charAt(0)}</div><div><h1>${esc(d.creator.name)}</h1><div class="handle">@${esc(d.creator.handle)}</div><div class="muted">${esc(d.creator.bio||"")}</div></div>`;$("grid").innerHTML=d.posts.map(p=>`<div class="tile" onclick='openPost(${JSON.stringify(p).replace(/</g,"\\u003c")})'><div class="lock">${p.access_type==="free"?"":"🔒"}</div><div class="shade"><span class="badge">${p.access_type==="free"?"GRATIS":p.access_type==="member"?"MEMBER":"PREMIUM"}</span></div></div>`).join("")}
async function openPost(p){$("modal").classList.add("show");$("body").innerHTML=`<h2>${esc(p.title||"Konten")}</h2><p class="muted">${p.access_type==="free"?"Konten gratis.":p.access_type==="member"?"Khusus member 30 hari.":"Premium satuan."}</p><div id="media"></div>${p.access_type==="free"?"":`<button class="cta" onclick="checkout('${p.access_type}','${p.id}',${Number(p.price_idr||0)})">${p.access_type==="member"?"Member 30 hari — Rp99.000":"Beli Premium — Rp"+Number(p.price_idr||0).toLocaleString("id-ID")}</button>`}<button class="cta secondary" onclick="loadMedia('${p.id}')">Buka Konten</button>`;loadMedia(p.id)}
async function loadMedia(id){try{const d=await j("/api/content/"+id+"/access");$("media").innerHTML=d.mediaType==="video"?`<video src="${d.url}" controls autoplay style="width:100%;border-radius:12px"></video>`:`<img src="${d.url}" style="width:100%;border-radius:12px">`}catch(e){$("media").innerHTML=`<p class="danger">${esc(e.message)}</p>`}}
async function checkout(kind,id,price){$("body").innerHTML=`<h2>Checkout ${kind==="member"?"Member":"Premium"}</h2><p class="muted">${kind==="member"?"Rp99.000 / 30 hari":"Rp"+price.toLocaleString("id-ID")}</p><input id="contact" class="input" placeholder="WhatsApp atau email"><button class="cta" onclick="pay('${kind}','${id}')">Lanjut ke Midtrans</button>`}
async function pay(kind,id){try{const d=await j("/api/checkout",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({kind,postId:id,contact:$("contact").value})});$("body").innerHTML=`<h2>Order ${esc(d.orderId)}</h2><p class="muted">Lanjutkan pembayaran.</p><a class="cta" href="${d.redirectUrl}" target="_blank" rel="noopener">Bayar di Midtrans</a><p class="muted">Setelah pembayaran berhasil, buka Akses Saya.</p>`}catch(e){alert(e.message)}}
async function portal(){history.pushState({},'','/access');$("home").style.display="block";$("profile").classList.remove("active");$("home").innerHTML=`<h1>Akses Saya</h1><div id="portal" class="card">Memuat…</div>`;try{const d=await j("/api/access/me");if(!d.authenticated){$("portal").innerHTML=`<p class="muted">Belum ada akses aktif.</p><input id="contact" class="input" placeholder="WhatsApp atau email"><button class="cta" onclick="activate()">Aktifkan Akses</button>`;return}$("portal").innerHTML=`<p class="success">Akses aktif</p>${d.member?`<div class="card"><b>Member</b><div class="muted">Berlaku sampai ${new Date(d.memberExpires).toLocaleString("id-ID")}</div></div>`:""}<h3>Konten yang dibeli</h3>${d.purchases.length?d.purchases.map(x=>`<div class="card"><b>${esc(x.title||"Konten")}</b><button class="cta" onclick="openPurchased('${x.post_id}')">Buka</button></div>`).join(""):"<p class='muted'>Belum ada pembelian premium.</p>"}<button class="cta secondary" onclick="logout()">Keluar</button>`}catch(e){$("portal").innerHTML=`<p class="danger">${esc(e.message)}</p>`}}
async function activate(){try{await j("/api/access/activate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contact:$("contact").value})});
const c=await j("/api/access/csrf",{skipCsrf:true});accessCsrf=c.csrf||"";portal()}catch(e){alert(e.message)}}async function openPurchased(id){try{const d=await j("/api/content/"+id+"/access");$("modal").classList.add("show");$("body").innerHTML=d.mediaType==="video"?`<video src="${d.url}" controls autoplay style="width:100%;border-radius:12px"></video>`:`<img src="${d.url}" style="width:100%;border-radius:12px">`}catch(e){alert(e.message)}}async function logout(){await j("/api/access/logout",{method:"POST"});portal()}function closeM(){$("modal").classList.remove("show")}window.onpopstate=()=>location.pathname.startsWith("/c/")?openCreator(location.pathname.split("/")[2]):location.pathname==="/access"?portal():home();const m=location.pathname.match(/^\\/c\\/([^/]+)$/);m?openCreator(m[1]):location.pathname==="/access"?portal():home();
</script></body></html>
